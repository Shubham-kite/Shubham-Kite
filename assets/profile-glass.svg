<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Shubham Kite — Python, web development, and data science</title>
  <desc id="desc">A liquid glass inspired profile banner with soft blue and violet light.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#111a36"/>
      <stop offset="1" stop-color="#17102d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".19"/>
      <stop offset=".48" stop-color="#dce8ff" stop-opacity=".065"/>
      <stop offset="1" stop-color="#b9a5ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#b7d6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d3b5ff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83e6ff"/>
      <stop offset="1" stop-color="#c7a4ff"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <circle cx="230" cy="95" r="115" fill="#387dff" fill-opacity=".68" filter="url(#blur)"/>
  <circle cx="945" cy="325" r="145" fill="#9a4dff" fill-opacity=".58" filter="url(#blur)"/>
  <circle cx="760" cy="55" r="72" fill="#49d8ff" fill-opacity=".35" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="42" width="1104" height="336" rx="30" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M80 43h380c-105 32-184 93-232 177-29 51-66 93-118 126z" fill="#fff" fill-opacity=".045"/>
    <path d="M80 67q0-24 24-24h820" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"/>
    <path d="M80 335q220-35 335-168" fill="none" stroke="#d8eaff" stroke-opacity=".12" stroke-width="1"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="159" fill="#f7f8ff" font-size="58" font-weight="700" letter-spacing="1">SHUBHAM KITE</text>
    <rect x="484" y="184" width="232" height="3" rx="2" fill="url(#accent)"/>
    <text x="600" y="231" fill="#e6eaff" font-size="22" font-weight="500" letter-spacing="3">PYTHON  ·  WEB DEVELOPMENT  ·  DATA SCIENCE</text>
    <text x="600" y="274" fill="#c4cbe0" font-size="17">Building projects, learning by doing, and exploring ideas with code.</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="444" y="305" width="98" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <text x="493" y="327" fill="#e8f8ff">PYTHON</text>
    <rect x="552" y="305" width="112" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <text x="608" y="327" fill="#f0eaff">DJANGO</text>
    <rect x="674" y="305" width="100" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <text x="724" y="327" fill="#e8f8ff">DATA</text>
  </g>
</svg>
